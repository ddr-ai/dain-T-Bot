# Builds the iOS app as an UNSIGNED .ipa for sideloading with esign.
# No certificates, no provisioning profiles, no p12 - you sign it yourself.
name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: xcodegen + xcodebuild (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project AutopilotTrader.xcodeproj \
            -scheme AutopilotTrader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS' \
            build 2>&1 | tee build.log

      - name: Surface compile errors (visible in annotations without log access)
        if: failure()
        working-directory: ios
        run: |
          echo "=== lines containing error/Error ==="
          grep -m 40 -i 'error' build.log || echo "(no lines containing error)"
          echo "=== fatal/failed markers ==="
          grep -m 10 -iE 'fatal|build failed|segmentation|assert|missing|incompatible|requires' build.log || true
          echo "=== last 60 lines of build.log ==="
          tail -60 build.log || true
          echo "=== write tail to step summary (publicly visible on run page) ==="
          tail -80 build.log >> "$GITHUB_STEP_SUMMARY" || true
          while IFS= read -r line; do
            msg=$(echo "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/::/%3A%3A/g')
            echo "::error::${msg}"
          done < <(grep -m 20 -i 'error' build.log || true)
          while IFS= read -r line; do
            msg=$(echo "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/::/%3A%3A/g')
            echo "::error::${msg}"
          done < <(grep -m 10 -iE 'fatal|build failed|requires|missing|incompatible' build.log || true)

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R "build/Build/Products/Release-iphoneos/AutopilotTrader.app" build/Payload/
          cd build
          zip -r "AutopilotTrader-unsigned.ipa" Payload
          ls -la AutopilotTrader-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutopilotTrader-unsigned-ipa
          path: ios/build/AutopilotTrader-unsigned.ipa
          retention-days: 30
