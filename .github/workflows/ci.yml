name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend unit tests (zero-dependency Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests (no npm install needed - Node stdlib only)
        run: cd backend && npm test

  backend-backtest-smoke:
    name: Backtest CLI smoke test (live public data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run walk-forward backtest on public candles
        run: cd backend && npm run backtest -- --symbol btcusd

  pwa-build:
    name: PWA typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm install --no-frozen-lockfile
      - run: npm run build
