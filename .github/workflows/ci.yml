name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend unit tests (zero-dependency Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run tests (no npm install needed - Node stdlib only)
        run: cd backend && npm test

  backend-backtest-smoke:
    name: Backtest CLI smoke test (live public data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run walk-forward backtest on public candles
        run: cd backend && npm run backtest -- --symbol btcusd

  pwa-build:
    name: PWA typecheck + build (+ publish dist branch on main)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No npm cache on purpose: the repo ships no package-lock.json
      # (the project is built from a clean npm install every time).
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Typecheck + build
        run: npm run build
      - name: Publish built dist to the 'dist' branch (static site source)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: pwa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b dist .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "pwa dist from CI [skip ci]" >/dev/null
          if ! git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist:dist 2> push.err; then
            echo "::error::dist push failed:"
            while IFS= read -r line; do
              msg=$(echo "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error::${msg}"
            done < push.err
            cat push.err >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
