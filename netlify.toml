# Netlify build configuration: ONE site serves the mobile-first React PWA and
# hosts the serverless trading engine (Netlify Functions in ./netlify/functions
# with state in Netlify Blobs). The API lives at https://<site>/api/... and the
# scheduled function in netlify/functions/engine.ts ticks the engine every
# minute. The PWA talks to it same-origin (VITE_API_BASE unset).
[build]
  command = "npm install --no-fund --no-audit && cd pwa && npm install --no-fund --no-audit && npm run build"
  publish = "pwa/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Correct content type for the PWA manifest (Chrome installability check).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Service worker must always be revalidated so updates propagate quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed, immutable Vite assets can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

